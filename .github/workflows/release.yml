# Builds the Windows installers of a version and publishes them on the GitHub "Releases" page.
#
# - Pushing a tag like `v0.4.0` builds that version automatically.
# - Older versions (tags created before this workflow existed) can be built from the
#   Actions tab: "Build installers" → "Run workflow" → enter the tag, e.g. `v0.1.0`.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The installer and the app show the version of the tag (older commits all said 0.1.0).
      - name: Set app version from tag
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const f = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = process.env.TAG.replace(/^v/, '');
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          "

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: AccountBook ${{ env.TAG }}
          releaseBody: |
            Version de test **${{ env.TAG }}** — voir CHANGELOG.md pour le détail des nouveautés.

            Installation sur Windows : téléchargez `AccountBook_…_x64-setup.exe` (ou le `.msi`) ci-dessous et lancez-le.
            Windows peut afficher « Windows a protégé votre ordinateur » (application non signée) : cliquez sur
            « Informations complémentaires » puis « Exécuter quand même ».

            Vos données sont conservées d'une version à l'autre (base de données mise à jour automatiquement).
          prerelease: true
