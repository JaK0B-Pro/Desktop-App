# Builds the Windows installers of each version and publishes them on the GitHub "Releases" page.
#
# - Every push checks the version in package.json; if release `v<version>` does not exist yet,
#   the installers are built (signed for the in-app updater, with the CHANGELOG section as notes) and
#   the release (and its tag) is created on that commit.
#   So a new version is published by raising the version number (package.json, Cargo.toml,
#   tauri.conf.json) in a commit.
# - Older versions can be built from the Actions tab: "Build installers" → "Run workflow",
#   with the commit and the version number (see CHANGELOG.md for the commit of each version).
name: Build installers

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit (SHA) to build"
        required: true
      version:
        description: "Version number, e.g. 0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.sha }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(node -p "require('./package.json').version")}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # "What's new" = this version's section of CHANGELOG.md (shown in the app's update window).
          {
            echo "notes<<END_OF_NOTES"
            if [ -f CHANGELOG.md ]; then
              awk -v v="## $version" 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md | sed '/^Commit `/d'
            fi
            echo "END_OF_NOTES"
          } >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists — nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The installer and the app show this version (older commits all said 0.1.0).
      # Update files (signed, for the in-app updater) are only produced when the signing key is set.
      - name: Set app version
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e "
            const fs = require('fs');
            const f = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = process.env.VERSION;
            if (c.bundle && process.env.HAS_KEY !== 'true') c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          "

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: AccountBook v${{ env.VERSION }}
          releaseCommitish: ${{ needs.plan.outputs.commit }}
          releaseBody: ${{ needs.plan.outputs.notes }}
          # Not a pre-release: the app looks for updates in the latest release.
          prerelease: false
